disabled_rules:
  - trailing_whitespace
  - identifier_name
  - multiple_closures_with_trailing_closure
  - large_tuple
  - non_optional_string_data_conversion
  - static_over_final_class
  - trailing_comma

custom_rules:
  no_japanese_period_in_doccomment:
    included: "**/*.swift"
    name: "No Japanese period in doc comment"
    regex: "^\\s*///.*。"
    message: "ドキュメントコメントの各行の末尾に「。」を付けないこと（Private.instructions.md に準拠）"
    severity: error

  require_triple_slash_doccomment:
    included: "**/*.swift"
    name: "Require triple slash doc comment"
    regex: "^\\s*/\\*\\*"
    message: "ドキュメントコメントは `///` を使用すること"
    severity: warning

line_length:
  warning: 200
  error: 300

# opt in rules can be added if desired
opt_in_rules:
  - empty_count
