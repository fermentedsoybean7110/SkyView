disabled_rules:
  - trailing_whitespace
  - identifier_name
  - multiple_closures_with_trailing_closure
  - large_tuple
  - non_optional_string_data_conversion
  - static_over_final_class
  - trailing_comma

# カスタムルールは一時的に削除済。将来的に導入する場合は
# SwiftLint のバージョンと互換性のある設定形式を利用すること

line_length:
  warning: 200
  error: 300

# opt in rules can be added if desired
opt_in_rules:
  - empty_count

